<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marielos - Mis XV Años</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;

      background:
        radial-gradient(
          circle at top,
          #8f0000 0%,
          #650000 45%,
          #320000 100%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px 15px;
    }


    .contenedor {

      width: 100%;
      max-width: 430px;

      text-align: center;

      padding: 35px 22px;

      border: 1px solid rgba(212,175,55,0.7);

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(120,0,0,0.92),
          rgba(55,0,0,0.96)
        );

      box-shadow:
        0 0 25px rgba(0,0,0,0.45),
        inset 0 0 25px rgba(212,175,55,0.08);
    }


    .decoracion {

      color: #d4af37;

      font-size: 25px;

      letter-spacing: 8px;

      margin-bottom: 12px;
    }


    .nombre {

      margin: 0;

      font-size: 42px;

      font-weight: normal;

      color: #f5d77a;

      letter-spacing: 3px;

      text-shadow:
        0 2px 5px #000;
    }


    .xv {

      margin-top: 4px;

      font-size: 26px;

      letter-spacing: 6px;

      color: #ffffff;

      text-transform: uppercase;
    }


    .linea {

      width: 100px;

      height: 2px;

      background: #d4af37;

      margin: 20px auto;
    }


    .mensaje {

      font-family: Arial, Helvetica, sans-serif;

      font-size: 16px;

      line-height: 1.5;

      color: #f8eeee;

      margin-bottom: 28px;
    }


    button,
    .boton-galeria {

      width: 100%;

      border: 1px solid #d4af37;

      border-radius: 12px;

      padding: 15px 18px;

      margin: 9px 0;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      display: block;

      background:
        linear-gradient(
          135deg,
          #d4af37,
          #f4df8a,
          #b8860b
        );

      color: #4a0000;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.3);

      transition: transform 0.15s ease;
    }


    button:active,
    .boton-galeria:active {

      transform: scale(0.97);

    }


    .boton-secundario {

      background: transparent;

      color: #f5d77a;

      box-shadow: none;
    }


    input[type="file"] {

      display: none;

    }


    #mensajeEstado {

      min-height: 24px;

      margin-top: 18px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 14px;

      color: #f5d77a;
    }


    #vistaPrevia {

      width: 100%;

      max-height: 300px;

      object-fit: contain;

      border-radius: 15px;

      margin: 18px auto;

      display: none;

      border: 1px solid #d4af37;
    }


    #camara {

      display: none;

      margin-top: 18px;
    }


    video {

      width: 100%;

      border-radius: 15px;

      background: #000;

      border: 1px solid #d4af37;
    }


    .texto-final {

      margin-top: 24px;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 12px;

      color: rgba(255,255,255,0.65);
    }

  </style>

</head>


<body>


  <main class="contenedor">


    <div class="decoracion">
      ✦ ✧ ✦
    </div>


    <h1 class="nombre">
      Marielos
    </h1>


    <div class="xv">
      Mis XV Años
    </div>


    <div class="linea"></div>


    <div class="mensaje">

      ¡Gracias por celebrar este momento
      tan especial conmigo!

      <br>

      Comparte tus mejores fotos
      y recuerdos de esta noche.

    </div>


    <!-- TOMAR FOTO -->

    <button id="botonCamara">

      📸 Tomar Foto

    </button>


    <!-- GALERÍA -->

    <label
      class="boton-galeria"
      for="galeria"
    >

      🖼️ Subir desde galería

    </label>


    <input
      id="galeria"
      type="file"
      accept="image/*"
    >


    <!-- VOLTEAR CÁMARA -->

    <button
      id="botonVoltear"
      class="boton-secundario"
      style="display:none;"
    >

      🔄 Voltear Cámara

    </button>


    <!-- CÁMARA -->

    <div id="camara">


      <video
        id="video"
        autoplay
        playsinline
      ></video>


      <button id="botonCapturar">

        📷 Capturar foto

      </button>


      <button
        id="botonCerrar"
        class="boton-secundario"
      >

        Cerrar cámara

      </button>


    </div>


    <!-- VISTA PREVIA -->

    <img
      id="vistaPrevia"
      alt="Vista previa"
    >


    <!-- MENSAJE -->

    <div id="mensajeEstado"></div>


    <div class="texto-final">

      Tus fotos se guardarán automáticamente
      para compartir este momento.

    </div>


  </main>


<script>


/* =========================================
   CONFIGURACIÓN CLOUDINARY
   ========================================= */

const NOMBRE_CLOUDINARY = "cguipzza";

const PRESET_CLOUDINARY = "fotos-invitacion";


/* =========================================
   ELEMENTOS
   ========================================= */

const botonCamara =
  document.getElementById("botonCamara");

const galeria =
  document.getElementById("galeria");

const botonVoltear =
  document.getElementById("botonVoltear");

const camara =
  document.getElementById("camara");

const video =
  document.getElementById("video");

const botonCapturar =
  document.getElementById("botonCapturar");

const botonCerrar =
  document.getElementById("botonCerrar");

const vistaPrevia =
  document.getElementById("vistaPrevia");

const mensajeEstado =
  document.getElementById("mensajeEstado");


/* =========================================
   VARIABLES DE CÁMARA
   ========================================= */

let transmision = null;

let camaraActual = "environment";


/* =========================================
   MENSAJES
   ========================================= */

function mostrarMensaje(texto) {

  mensajeEstado.textContent = texto;

}


/* =========================================
   SUBIR FOTO A CLOUDINARY
   ========================================= */

async function subirFoto(archivo) {

  if (!archivo) {

    return;

  }


  mostrarMensaje(
    "Subiendo tu foto..."
  );


  /* Vista previa */

  vistaPrevia.src =
    URL.createObjectURL(archivo);

  vistaPrevia.style.display =
    "block";


  /* Preparar información */

  const datos =
    new FormData();


  datos.append(
    "file",
    archivo
  );


  datos.append(
    "upload_preset",
    PRESET_CLOUDINARY
  );


  try {


    const respuesta =
      await fetch(

        `https://api.cloudinary.com/v1_1/${NOMBRE_CLOUDINARY}/image/upload`,

        {

          method: "POST",

          body: datos

        }

      );


    const resultado =
      await respuesta.json();


    if (!respuesta.ok) {

      throw new Error(

        resultado.error?.message ||
        "No se pudo subir la foto."

      );

    }


    mostrarMensaje(
      "✨ ¡Tu foto se subió correctamente! ❤️"
    );


  }

  catch (error) {


    console.error(error);


    mostrarMensaje(
      "❌ No se pudo subir la foto. Inténtalo nuevamente."
    );


  }

}


/* =========================================
   GALERÍA
   ========================================= */

galeria.addEventListener(

  "change",

  function(evento) {


    const archivo =
      evento.target.files[0];


    if (archivo) {

      subirFoto(archivo);

    }


    evento.target.value = "";

  }

);


/* =========================================
   INICIAR CÁMARA
   ========================================= */

async function iniciarCamara() {


  try {


    if (transmision) {

      transmision
        .getTracks()
        .forEach(
          pista => pista.stop()
        );

    }


    transmision =
      await navigator.mediaDevices.getUserMedia(

        {

          video: {

            facingMode: {

              ideal: camaraActual

            }

          },

          audio: false

        }

      );


    video.srcObject =
      transmision;


    camara.style.display =
      "block";


    botonVoltear.style.display =
      "block";


    mostrarMensaje("");

  }


  catch (error) {


    console.error(error);


    mostrarMensaje(
      "❌ No se pudo abrir la cámara. Revisa los permisos del navegador."
    );


  }

}


/* =========================================
   BOTÓN TOMAR FOTO
   ========================================= */

botonCamara.addEventListener(

  "click",

  iniciarCamara

);


/* =========================================
   VOLTEAR CÁMARA
   ========================================= */

botonVoltear.addEventListener(

  "click",

  async function() {


    if (
      camaraActual === "environment"
    ) {

      camaraActual = "user";

    }

    else {

      camaraActual = "environment";

    }


    await iniciarCamara();


  }

);


/* =========================================
   CAPTURAR FOTO
   ========================================= */

botonCapturar.addEventListener(

  "click",

  function() {


    const lienzo =
      document.createElement("canvas");


    lienzo.width =
      video.videoWidth;


    lienzo.height =
      video.videoHeight;


    const contexto =
      lienzo.getContext("2d");


    contexto.drawImage(

      video,

      0,

      0

    );


    lienzo.toBlob(

      function(blob) {


        if (blob) {


          const archivo =
            new File(

              [blob],

              `Marielos-XV-${Date.now()}.jpg`,

              {

                type:
                  "image/jpeg"

              }

            );


          subirFoto(archivo);


        }


      },

      "image/jpeg",

      0.90

    );


  }

);


/* =========================================
   CERRAR CÁMARA
   ========================================= */

botonCerrar.addEventListener(

  "click",

  function() {


    if (transmision) {


      transmision
        .getTracks()
        .forEach(
          pista => pista.stop()
        );


    }


    transmision = null;


    video.srcObject = null;


    camara.style.display =
      "none";


    botonVoltear.style.display =
      "none";


  }

);


</script>


</body>
</html>
